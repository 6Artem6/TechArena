# ---------------------------------------------------------------------------
# Декларативные правила классификации атрибутов шага (rule_engine.py)
#
# Поля target_field должны совпадать с полями StepInfo.
# Для нового проекта: добавить правила здесь — Python-код не меняется.
# ---------------------------------------------------------------------------
classification_rules:
  # --- Тип поезда: NOT_G (30) > G (20) > OTHER (10) ---
  # NOT_G имеет наивысший приоритет: "not high-speed" → OTHER, не G
  - rule_id: train_not_g
    target_field: train_type
    target_value: OTHER
    priority: 30
    group: train_type
    positive_patterns:
      - '\bnot\s+high.?speed\b'
      - '\bregular\s+train\b'
      - 'other\b.{0,30}\btype'
    negative_patterns: []
  - rule_id: train_g
    target_field: train_type
    target_value: G
    priority: 20
    group: train_type
    positive_patterns:
      - '\bhigh.?speed\b'
      - '\bgaotie\b'
      - '\bgao.?tie\b'
      - '\bg.?train\b'
      - '\bg-?\s*type\b'
      - '\bdongche\b'
      - '\bdong.?che\b'
      - '\bd.?train\b'
      - '\bd-?\s*type\b'
      - '\bcrh\b'
      - '\bbullet\b'
    negative_patterns: []
  - rule_id: train_other
    target_field: train_type
    target_value: OTHER
    priority: 10
    group: train_type
    positive_patterns:
      - '\bregular\b'
      - "'?other'?\\s*type"
      - '\bnon.?high.?speed\b'
      - '\bslow\b'
      - '\bnormal\s+train\b'
    negative_patterns: []

  # --- Refused / отказ системы ---
  - rule_id: is_refused
    target_field: is_refused
    target_value: true
    priority: 10
    group: null
    positive_patterns: ['\bthe\s+system\s+(refuses|rejects|denies)\b']
    negative_patterns: []

  # --- Класс места ---
  - rule_id: seat_first
    target_field: seat_class
    target_value: FIRST
    priority: 20
    group: seat_class
    positive_patterns: ['\b(first.?class|business.?class|1st.?class)\b']
    negative_patterns: []
  - rule_id: seat_second
    target_field: seat_class
    target_value: SECOND
    priority: 20
    group: seat_class
    positive_patterns: ['\b(second.?class|economy|2nd.?class|standard)\b']
    negative_patterns: []
  # --- Дополнительные классы мест (сгенерировано gen_classification_rules.py) ---
  - rule_id: seat_hard_seat
    target_field: seat_class
    target_value: HARDSEAT
    priority: 20
    group: seat_class
    positive_patterns: ['\bhard\s+seat\b']
    negative_patterns: []
  - rule_id: seat_soft_seat
    target_field: seat_class
    target_value: SOFTSEAT
    priority: 20
    group: seat_class
    positive_patterns: ['\bsoft\s+seat\b']
    negative_patterns: []
  - rule_id: seat_hard_bed
    target_field: seat_class
    target_value: HARDBED
    priority: 20
    group: seat_class
    positive_patterns: ['\b(hard\s+sleeper|hard\s+bed)\b']
    negative_patterns: []
  - rule_id: seat_soft_bed
    target_field: seat_class
    target_value: SOFTBED
    priority: 20
    group: seat_class
    positive_patterns: ['\b(soft\s+sleeper|soft\s+bed)\b']
    negative_patterns: []
  - rule_id: seat_high_soft_bed
    target_field: seat_class
    target_value: HIGHSOFTBED
    priority: 20
    group: seat_class
    positive_patterns: ['\b(high\s+soft\s+bed|premium\s+sleeper)\b']
    negative_patterns: []

  # --- Тип оплаты: empty > external > internal (приоритеты 30/20/10) ---
  - rule_id: pay_empty
    target_field: pay_type
    target_value: external
    priority: 30
    group: pay_type
    positive_patterns: ['\binternal\b.{0,50}\bempty\b']
    negative_patterns: []
  - rule_id: pay_external
    target_field: pay_type
    target_value: external
    priority: 20
    group: pay_type
    positive_patterns: ['\bexternal\b']
    negative_patterns: []
  - rule_id: pay_internal
    target_field: pay_type
    target_value: internal
    priority: 10
    group: pay_type
    positive_patterns: ['\binternal\b']
    negative_patterns: []

# Маппинг Qwen StepParams.get_service() → поля StepInfo
# combine: any → True если хотя бы один ключ True; False если все False; None → regex fallback
# combine: first (default) → значение первого non-None ключа
qwen_service_mappings:
  has_food:      {keys: [food_train, food_station], combine: any}
  has_insurance: {keys: [insurance]}
  has_luggage:   {keys: [luggage]}

# Правила инъекции BM25-токенов в запрос по значениям StepInfo полей
# match_field: поле StepInfo; match_value: ожидаемое значение
# text_contains: опциональный текстовый фильтр (проверяется в action.lower())
token_injection_rules:
  # Атрибуты бронирования → усиливают нужный сервис
  - {match_field: seat_class, match_value: "FIRST",     tokens: ["first class"]}
  - {match_field: seat_class, match_value: "SECOND",    tokens: ["second class"]}
  - {match_field: seat_class, match_value: "HARDSEAT",  tokens: ["hard seat"]}
  - {match_field: seat_class, match_value: "SOFTSEAT",  tokens: ["soft seat"]}
  - {match_field: seat_class, match_value: "HARDBED",   tokens: ["hard sleeper"]}
  - {match_field: seat_class, match_value: "SOFTBED",   tokens: ["soft sleeper"]}
  - {match_field: seat_class, match_value: "HIGHSOFTBED", tokens: ["high soft bed"]}
  - {match_field: has_food,      match_value: true,     tokens: ["food"]}
  - {match_field: has_insurance, match_value: true,     tokens: ["insurance"]}
  - {match_field: has_luggage,   match_value: true,     tokens: ["consign luggage"]}
  # step_type → handler disambiguation токены
  - {match_field: step_type, match_value: search_transit,  tokens: ["transfer", "transfer", "via"]}
  - {match_field: step_type, match_value: cancel,          tokens: ["ticket", "verify"]}
  - {match_field: step_type, match_value: rebook,          tokens: ["rebook", "rebook"]}
  - {match_field: step_type, match_value: check_price,     tokens: ["price", "price"]}
  - {match_field: step_type, match_value: query_insurance, tokens: ["assurance", "assurance"]}
  - {match_field: step_type, match_value: update_consign,  tokens: ["consign", "consign", "update"]}
  - {match_field: step_type, match_value: add_consign,     tokens: ["consign", "consign", "insert"]}
  - {match_field: step_type, match_value: query_consign,   tokens: ["consign", "consign"]}
  - {match_field: step_type, match_value: query_consign,   tokens: ["account"], text_contains: "account"}
  - {match_field: step_type, match_value: get_contact,     tokens: ["account", "account"]}
  - {match_field: step_type, match_value: enter_station,   tokens: ["execute", "execute"]}
  - {match_field: step_type, match_value: collect,         tokens: ["collect", "collect"]}
  - {match_field: step_type, match_value: query_orders,    tokens: ["query", "order", "orders"]}
  - {match_field: step_type, match_value: check_refund,    tokens: ["calculate", "refund"]}

# Составные правила с приоритетным источником значения (Qwen > fallback)
complex_token_rules:
  - trigger_field: step_type
    trigger_value: pay
    priority_source: payment_mode   # step_params атрибут (Qwen)
    fallback_field: pay_type        # StepInfo поле (из RuleEngine/classification_rules)
    value_mapping:
      external: ["payment", "payment", "service"]
      internal: ["inside"]

# ---------------------------------------------------------------------------
# Classify Prompt — Dynamic Builder (build_classifier_system_prompt)
#
# Вся доменная специфика classify_step() собирается из этих секций.
# Для нового проекта — заменить только этот блок, Python-код не меняется.
# ---------------------------------------------------------------------------

# Разрешённые значения step_type
allowed_step_types:
  - login
  - register
  - book
  - pay
  - cancel
  - rebook
  - collect
  - search_train
  - search_advanced
  - search_transit
  - view_trip
  - query_orders
  - query_consign
  - add_consign
  - update_consign
  - add_contact
  - get_contact
  - browse_food_station
  - query_food_trip
  - check_price
  - check_refund
  - query_insurance
  - enter_station
  - admin_login
  - add_station
  - add_train_type
  - add_route
  - add_trip
  - add_price
  - other

# Схема attributes: что может появиться в атрибутах классификации
domain_attributes_schema:
  train_type:
    description: "Speed category of train"
    allowed_values: ['"G" (high-speed/bullet/CRH/DongChe)', '"OTHER" (regular/slow)']
  seat_class:
    description: "Class of service"
    allowed_values: ['"FIRST" (first-class/business)', '"SECOND" (second-class/economy)']
  payment_mode:
    description: "Source of funds"
    allowed_values: ['"internal" (internal balance)', '"external" (external service)']
  search_criteria:
    description: "Search optimization criteria (comma-separated if multiple)"
    allowed_values: [cheapest, quickest, fewest_stops, transfer]

# Схема features: optional addons/modifiers (заменяет classify_service_descriptions)
# Только те, что реально используются в проекте (из optional_service_groups)
domain_features_schema:
  - name: food_train
    description: "food served on board the train"
  - name: food_station
    description: "food available at the station"
  - name: insurance
    description: "travel insurance/assurance coverage"
  - name: luggage
    description: "luggage/consign baggage handling"

# Доменно-специфичные правила для RULES-блока промпта
domain_specific_rules:
  - "search_transit = ONLY when transfer/connection/via/layover explicitly mentioned"
  - "search_advanced = cheapest/quickest/fewest-stops (no transfer)"
  - "features: omit unmentioned items (keep array short)"
  - "attributes: omit keys with empty/unknown values"
  - "keywords: for pay add payment signal; for book add seat/service signals; skip for search"

# Few-shot примеры для промпта (JSON-строки внутри одинарных кавычек YAML)
few_shot_examples:
  - input: "book first-class with food on train and insurance"
    json_output: '{"step_type":"book","actor_role":"passenger","keywords":["first class","food","insurance"],"attributes":{"seat_class":"FIRST"},"features":[{"name":"food_train","state":true},{"name":"insurance","state":true}],"search_filters":[]}'
  - input: "pay using internal account balance"
    json_output: '{"step_type":"pay","actor_role":"","keywords":["inside"],"attributes":{"payment_mode":"internal"},"features":[],"search_filters":[]}'
  - input: "pay using external payment service"
    json_output: '{"step_type":"pay","actor_role":"","keywords":["payment","service"],"attributes":{"payment_mode":"external"},"features":[],"search_filters":[]}'
  - input: "advanced search: cheapest G-train trips"
    json_output: '{"step_type":"search_advanced","actor_role":"","keywords":[],"attributes":{"train_type":"G","search_criteria":"cheapest"},"features":[],"search_filters":[]}'
  - input: "ask for trips with a transfer via Suzhou"
    json_output: '{"step_type":"search_transit","actor_role":"","keywords":["transfer"],"attributes":{"search_criteria":"transfer"},"features":[],"search_filters":[]}'
  - input: "query G-train orders (status: Paid)"
    json_output: '{"step_type":"query_orders","actor_role":"","keywords":[],"attributes":{"train_type":"G"},"features":[],"search_filters":[{"key":"status","value":"Paid"}]}'

