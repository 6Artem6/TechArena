# domain_config.yaml — единая точка хранения доменных констант.
#
# Все значения здесь — переносимые дефолты для train-ticket.
# Для нового репозитория/фреймворка — создать свой domain_config.yaml
# (или расширить этот) рядом с predict.py/src/.
#
# Все regex-паттерны в single-quoted YAML строках: backslash сохраняется буквально
# (YAML single-quote: только '' экранирует апостроф).

# service_naming, optional_service_groups убраны:
#   генерируются из скелета через scripts/gen_project_config.py → cache/project_config.json
#
# optional_service_patterns убраны:
#   генерируются через scripts/gen_optional_patterns.py → cache/optional_patterns.json
#   fallback при отсутствии кеша — ValueError (Qwen должен быть доступен)

# ---------------------------------------------------------------------------
# Директории, исключённые при обходе репозитория (walker.py)
#
# Список дополняется динамически из .gitignore анализируемого репозитория.
# Здесь: директории, специфичные для build-систем и IDE (которых нет в .gitignore),
# или универсальные runtime/cache директории.
# ---------------------------------------------------------------------------
excluded_dirs:
  - target          # Maven/Gradle build output
  - old-docs        # устаревшая документация
  - .mvn            # Maven wrapper
  - build           # Generic build dir
  - .idea           # IntelliJ IDE
  - dist            # JavaScript dist
  - .gradle         # Gradle cache
  - test-output     # TestNG output
  - .cache          # Generic cache
  - charts          # Helm-чарты ({{ }} синтаксис невалиден для PyYAML)
  - node_modules    # npm packages
  - __pycache__     # Python bytecode
  - venv            # Python virtual env
  - .git            # Git metadata

# func_variant_suffixes убраны:
#   генерируются из скелета через scripts/gen_project_config.py → cache/project_config.json

# ---------------------------------------------------------------------------
# Token Taxonomy — классификация токенов имён сервисов (service_classifier.py)
# ---------------------------------------------------------------------------

# tier2_arch_tokens убраны:
#   генерируются из скелета через scripts/gen_project_config.py → cache/project_config.json
#   (whitelist архитектурных ролей ∩ реальные classnames проекта + Qwen-расширение)

# tier4_remote_tokens убраны:
#   генерируются из скелета через scripts/gen_project_config.py → cache/project_config.json
#   (known auth/security whitelist ∩ реальные tokens скелета + Qwen-расширение)

# Tier 4 Executes: строгий набор только для фильтра executes
tier4_executes_tokens:
  - verify
  - verification
  - code   # "verification-code" паттерн
  - captcha

# ---------------------------------------------------------------------------
# Паттерны типа поезда — step_typer.py
#
# ВНИМАНИЕ: DongChe здесь относится к G-диапазону для BM25-disambiguation.
# В oracle.py DongChe трактуется как D-тип для точного pruning (разные роли!).
# ---------------------------------------------------------------------------
step_train_patterns:
  G:
    - 'high.?speed'
    - 'gaotie'
    - 'gao.?tie'
    - 'g.?train'
    - 'g-?\s*type'
    - 'dongche'
    - 'dong.?che'
    - 'd.?train'
    - 'd-?\s*type'
    - 'crh'
    - 'bullet'
  OTHER:
    - 'regular'
    - "'?other'?\\s*type"
    - 'non.?high.?speed'
    - 'slow'
    - 'normal\s+train'
  NOT_G:
    - 'not\s+high.?speed'
    - 'regular\s+train'
    - 'other\b.{0,30}\btype'

# ---------------------------------------------------------------------------
# Паттерны типа поезда — oracle.py
#
# ВНИМАНИЕ: DongChe здесь D-тип (для точного pruning по BFS ветвям).
# NOT_G имеет приоритет над G (предотвращает false positive "not high-speed").
# ---------------------------------------------------------------------------
oracle_train_patterns:
  G:
    - 'high.?speed'
    - 'g.train'
    - 'g-?\s*type'
    - 'gaotie'
    - 'gao.?tie'
  D:
    - 'd.train'
    - 'd-?\s*type'
    - 'dongche'
    - 'dong.?che'
  NOT_G:
    - 'not\s+high.?speed'
    - 'regular\s+train'
    - 'other\b.{0,30}\btype'

# security_di удалён: DI-контракты (loadUserByUsername, UserDetails callbacks и др.)
# авто-обнаруживаются из скелета в src/trace/closure.py через implements_raw + @Override.

# ---------------------------------------------------------------------------
# Spring Security фильтр — критерии авто-обнаружения (closure.py, P-57/P-101)
# ---------------------------------------------------------------------------
security_filter:
  # Подстроки FQN, сигнализирующие о JWT фильтре (устаревший путь — legacy fallback)
  fqn_markers:
    - ".jwt."
    - ".security.jwt."
  # Метод, который должен начинаться с этого prefix
  method_prefix: "doFilter"
  # Родительские классы (extends_raw) — Spring Security фильтры
  # OncePerRequestFilter: Spring (javax); до Spring 6 / Boot 3 использует javax.servlet
  # GenericFilterBean: старый Spring способ (встречается редко)
  extends_markers:
    - "OncePerRequestFilter"
    - "GenericFilterBean"
  # Интерфейсы (implements_raw) — напрямую в скелете обычно не заполняется
  # но добавлено для поддержки jakarta.servlet (Spring Boot 3+, Jakarta EE 9+)
  implements_markers:
    - "javax.servlet.Filter"
    - "jakarta.servlet.Filter"

# step_rules удалены: классификация шагов выполняется Qwen (Pass 1, cls_v3 кеш).
# Прогрев кеша: python scripts/warm_qwen_classify_cache.py
# При отсутствии Qwen step_typer.py вернёт step_type="unknown" → pipeline деградирует gracefully.

# ---------------------------------------------------------------------------
# Типы шагов, для которых Qwen keywords безопасно инжектировать в extra_tokens.
# Для search/* и view_trip keywords ("cheapest", "trips") сдвигают BM25 вредно.
# ---------------------------------------------------------------------------
safe_keyword_step_types:
  - book
  - pay
  - cancel
  - collect
  - rebook
  - enter_station
  - add_consign
  - query_consign
  - check_price
  - check_refund

# action_vocabulary удалён: семантический мост NL → code обеспечивается
# dense-векторами (SemanticReranker / BGE-M3) в src/similarity/encoder.py.

# Дублировать URL path в doc_text base (усиливает TF URL-сегментов в BM25)
duplicate_url_path: false

# NLP baseline стоп-слова для кластеризации тегов сервисов (gen_project_config.py)
# Generic English words которые появляются в Qwen-сгенерированных тегах у всех сервисов
# но не являются domain-специфичными — нужно исключить до кластеризации
tag_stop_base:
  - management
  - retrieval
  - service
  - system
  - operations
  - data
  - admin
  - information
  - handling
  - specific
  - creation
  - deletion
  - update
  - access
  - processing
  - other
  - inside
  - based
  - record
  - retrieve
  - insert
  - create
  - delete
  - batch
  - unique
  - identifier
  - existing
  - available
  - list
  - name
  - type
  - details
  - config
  - request
  - lookup
  - search
  - query
  - send
  - notify
  - contact

# Архитектурные суффиксы-исключения (gen_project_config.py tier2)
# Суффиксы классов слишком generic для arch-роли — встречаются у всех Spring Boot сервисов
arch_suffix_stop:
  - application
  - data
  - info
  - type
  - result
  - response
  - request
  - queues

# Дополнительные arch-токены которые редко встречаются как суффиксы классов
# но являются архитектурными ролями (< 10% модулей в проекте)
arch_token_extra:
  - dto
  - handler
  - provider
  - util
  - utils

# Разрешённые auth/security токены — фильтр поверх auto-candidates (gen_project_config.py tier4)
# Токены из auth-namespace модулей, которые семантически связаны с auth/credentials
auth_token_whitelist:
  - auth
  - authentication
  - authorize
  - authorization
  - verify
  - verification
  - jwt
  - token
  - credential
  - credentials
  - password
  - secret
  - captcha
  - encoder
  - username
  - expir
  - refresh
  - claim
  - bearer
  - otp
  - role
  - principal
  - authorities
  - enabled
  - locked

# Шумные токены при поиске auth/security кандидатов (gen_project_config.py)
# Generic HTTP / config / bootstrap слова — не связаны с auth-логикой
auth_namespace_noise:
  - cors
  - configure
  - mapping
  - configurer
  - get
  - add
  - find
  - create
  - delete
  - all
  - non
  - default
  - main
  - rest
  - template
  - rand
  - color
