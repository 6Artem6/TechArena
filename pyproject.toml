[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    venv
  | \.git
  | train-ticket
  | lib
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["venv/*", "train-ticket/*", "lib/*"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["venv", "train-ticket", "lib"]
